name: LinkedIn Daily Content Automation

on:
  schedule:
    # ── Morning post: 8:00 AM IST = 2:30 AM UTC  (Mon–Fri) ──────────────────
    - cron: '30 2 * * 1-5'
    # ── Evening post: 6:00 PM IST = 12:30 PM UTC (Mon–Fri) ──────────────────
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Make.com post)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      story_count:
        description: 'Number of stories (1-5)'
        required: false
        default: '5'

jobs:
  run-agent:
    name: Generate & Post LinkedIn Content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn Automation Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          USE_LOCAL_STORAGE: "true"
          TOP_STORIES_COUNT: ${{ github.event.inputs.story_count || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GOOGLE_SHEETS_CREDS: ""
          GOOGLE_SHEET_ID: ""
          GOOGLE_SHEET_TAB: "PostQueue"
        run: |
          python main.py --story-count ${{ github.event.inputs.story_count || '5' }}

      - name: Upload generated posts as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-posts-${{ github.run_id }}
          path: posts_output/
          retention-days: 30
